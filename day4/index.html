
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Toolkit - Day 4</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Notes Toolkit</h1>
      <p>Write your thoughts and keep track of your words.</p>
    </header>

    <main>
      <label for="note-text">Your note</label>
      <textarea
        id="note-text"
        rows="10"
        maxlength="1000"
        placeholder="Start typing your note..."
      ></textarea>

      <div class="counts">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="actions">
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>
    </main>

    <footer>
      <p>Day 4 — Web Foundations</p>
    </footer>
  </body>
</html>
